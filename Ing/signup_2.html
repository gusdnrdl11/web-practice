<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>membership</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main_2">
    <div class="membership-layout">
        <!--회원가입화면-->
        <form>
            <label>
                아이디  <br> 
                <input type="text" value="" name="user-id" required> <br>
            </label>
            <label>
                비밀번호 <br>
                <input type="password" maxlength="20" value="" name="password" required> <br>
            </label>
            <label>
                비밀번호 확인 <br>
                <input type="password" maxlength="20" value="" name="password-check" required> <br>
            </label>
            <label>
                e-mail <br>
                <input type="email" value="" name="email" required> <br>
            </label>
            <label>
                생년월일 <br>
                <input type="date" name ="born"> <br>
            </label>
            <label>관심 분야 : <br>
                <select id="interest" name="interest" required>
                    <option value="" selected disabled hidden></option>
                    <option value="ai">인공지능</option>
                    <option value="game">게임</option>
                    <option value="web">웹개발</option>
                    <option value="other">기타</option>
                </select> <br>
            </label>
            <label>
                가입 목적 <br>
                <input type="radio" name="purpose" value="profile" > 프로필 확인 <br>
                <input type="radio" name="purpose" value="project"> 프로젝트 확인 <br>
            </label>
            <label>
                <input type="checkbox" name="agree" value="yes" required>이용약관에 동의합니다 <br>   
            </label>    
                <button type="submit">회원가입하기</button>
        </form>
    </div>
    
</body>
</html>
